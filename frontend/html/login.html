<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyMate - 登录</title>
    <!-- Element UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <h1><i class="fas fa-rainbow"></i> DailyMate</h1>
            <p>您的个人日常管理助手，轻松管理待办事项和账单，让生活更有条理</p>
            <div class="features">
                <div class="feature-item">
                    <i class="fas fa-tasks"></i>
                    <h4>待办管理</h4>
                    <p>智能分类，优先级管理</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <h4>记账功能</h4>
                    <p>收支明细，财务分析</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-calendar-alt"></i>
                    <h4>日历视图</h4>
                    <p>直观查看日程安排</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-chart-line"></i>
                    <h4>数据统计</h4>
                    <p>智能分析，趋势预测</p>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-header">
                <h2>登录您的账户</h2>
                <p>欢迎回来！请输入您的登录信息</p>
            </div>
            
            <!-- 登录表单 -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" class="form-input" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="auth-btn">登录</button>
                <span class="auth-error" id="loginError"></span>
                <div class="auth-links">
                    <p>还没有账户？ <a href="register.html" class="auth-link">立即注册</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 用户数据模型
        class User {
            constructor(id, username, password, email = '', avatar = '', isDelete = 0) {
                this.id = id;
                this.username = username;
                this.password = password;
                this.email = email;
                this.avatar = avatar || 'https://img.icons8.com/color/48/000000/user-male-circle--v2.png';
                this.isDelete = isDelete;
                this.createdAt = new Date().toISOString();
                this.updatedAt = new Date().toISOString();
            }
        }

        // 数据存储管理器
        class AuthManager {
            constructor() {
                this.initStorage();
                this.loadData();
            }

            initStorage() {
                if (!localStorage.getItem('dailyMate_users')) {
                    localStorage.setItem('dailyMate_users', JSON.stringify([]));
                }
                if (!localStorage.getItem('dailyMate_currentUser')) {
                    localStorage.setItem('dailyMate_currentUser', JSON.stringify(null));
                }
                
                // 初始化测试用户（如果不存在）
                this.initTestUser();
            }

            loadData() {
                this.users = JSON.parse(localStorage.getItem('dailyMate_users')) || [];
                this.currentUser = JSON.parse(localStorage.getItem('dailyMate_currentUser'));
                
                // 检查是否已登录，如果是则跳转到主页面
                if (this.currentUser) {
                    window.location.href = 'index.html';
                }
            }

            saveData() {
                localStorage.setItem('dailyMate_users', JSON.stringify(this.users));
                localStorage.setItem('dailyMate_currentUser', JSON.stringify(this.currentUser));
            }

            // 初始化测试用户
            initTestUser() {
                const users = JSON.parse(localStorage.getItem('dailyMate_users'));
                const testUserExists = users.some(user => user.username === 'test');
                
                if (!testUserExists && users.length === 0) {
                    const testUser = new User(
                        Date.now(),
                        'test',
                        '123456',
                        'test@example.com'
                    );
                    
                    users.push(testUser);
                    localStorage.setItem('dailyMate_users', JSON.stringify(users));
                    
                    // 初始化测试数据
                    this.initTestData(testUser.id);
                }
                
                // 初始化演示用户
                const demoUserExists = users.some(user => user.username === 'demo');
                if (!demoUserExists) {
                    const demoUser = new User(
                        Date.now() + 1,
                        'demo',
                        'demo123',
                        'demo@example.com'
                    );
                    users.push(demoUser);
                    localStorage.setItem('dailyMate_users', JSON.stringify(users));
                }
            }

            // 初始化测试数据
            initTestData(userId) {
                // 初始化待办事项数据
                if (!localStorage.getItem('dailyMate_todos')) {
                    const testTodos = [
                        {
                            id: Date.now() + 1,
                            userId: userId,
                            title: '完成项目报告',
                            content: '需要完成本周的项目进度报告',
                            priority: 1,
                            status: 1,
                            date: new Date().toISOString().split('T')[0],
                            startTime: new Date(Date.now() + 60 * 60 * 1000).toISOString(),
                            endTime: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(),
                            finishTime: new Date().toISOString(),
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        },
                        {
                            id: Date.now() + 2,
                            userId: userId,
                            title: '购买日常用品',
                            content: '去超市购买牛奶、面包、水果等',
                            priority: 2,
                            status: 0,
                            date: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                            startTime: '',
                            endTime: '',
                            finishTime: '',
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        },
                        {
                            id: Date.now() + 3,
                            userId: userId,
                            title: '预约医生检查',
                            content: '预约年度体检',
                            priority: 3,
                            status: 1,
                            date: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                            startTime: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString(),
                            endTime: new Date(Date.now() - 23 * 60 * 60 * 1000).toISOString(),
                            finishTime: new Date(Date.now() - 23 * 60 * 60 * 1000).toISOString(),
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        }
                    ];
                    
                    localStorage.setItem('dailyMate_todos', JSON.stringify(testTodos));
                }
                
                // 初始化账单数据
                if (!localStorage.getItem('dailyMate_bills')) {
                    const today = new Date().toISOString().split('T')[0];
                    const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                    
                    const testBills = [
                        {
                            id: Date.now() + 4,
                            userId: userId,
                            type: 1,
                            category: '工资收入',
                            amount: 8000,
                            remark: '本月工资',
                            date: today,
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        },
                        {
                            id: Date.now() + 5,
                            userId: userId,
                            type: 1,
                            category: '其他收入',
                            amount: 900,
                            remark: '兼职收入',
                            date: today,
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        },
                        {
                            id: Date.now() + 6,
                            userId: userId,
                            type: 2,
                            category: '餐饮',
                            amount: 85,
                            remark: '午餐外卖',
                            date: today,
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        },
                        {
                            id: Date.now() + 7,
                            userId: userId,
                            type: 2,
                            category: '购物',
                            amount: 200,
                            remark: '购买衣服',
                            date: today,
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        },
                        {
                            id: Date.now() + 8,
                            userId: userId,
                            type: 2,
                            category: '交通',
                            amount: 50,
                            remark: '地铁充值',
                            date: yesterday,
                            isDelete: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        }
                    ];
                    
                    localStorage.setItem('dailyMate_bills', JSON.stringify(testBills));
                }
            }

            // 用户登录
            loginUser(username, password) {
                const user = this.users.find(u => 
                    u.username === username && 
                    u.password === password && 
                    u.isDelete === 0
                );
                
                if (user) {
                    this.currentUser = user;
                    this.saveData();
                    return { success: true, user };
                }
                return { success: false, message: '用户名或密码错误' };
            }

            // 显示通知
            showNotification(message, type = 'success') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                // 3秒后移除通知
                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease-out';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            document.body.removeChild(notification);
                        }
                    }, 300);
                }, 3000);
            }

            // 显示错误
            showError(elementId, message) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.textContent = message;
                    element.style.display = 'block';
                    
                    setTimeout(() => {
                        element.style.display = 'none';
                    }, 3000);
                }
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            // API配置
            const API_CONFIG = {
                BASE_URL: 'http://localhost:8080',
                TOKEN_KEY: 'dailyMate_token',
                USER_KEY: 'dailyMate_user'
            };
            // 获取表单元素
            const loginForm = document.getElementById('loginForm');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginError = document.getElementById('loginError');
            // 表单提交事件
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = loginUsername.value.trim();
                const password = loginPassword.value;
                // 验证输入
                if (!username || !password) {
                    loginError.textContent = '请输入用户名和密码';
                    loginError.style.display = 'block';
                    setTimeout(() => { loginError.style.display = 'none'; }, 3000);
                    return;
                }
                try {
                    const response = await fetch(`${API_CONFIG.BASE_URL}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await response.json();
                    if (data.success && data.token) {
                        // 保存token和用户信息到localStorage
                        localStorage.setItem(API_CONFIG.TOKEN_KEY, data.token);
                        localStorage.setItem(API_CONFIG.USER_KEY, JSON.stringify(data.user));
                        // 显示成功通知
                        const notification = document.createElement('div');
                        notification.className = 'notification success';
                        notification.textContent = '登录成功！正在跳转...';
                        document.body.appendChild(notification);
                        setTimeout(() => {
                            notification.style.animation = 'slideOut 0.3s ease-out';
                            setTimeout(() => { if (notification.parentNode) document.body.removeChild(notification); }, 300);
                        }, 1200);
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        loginError.textContent = data.msg || data.message || '用户名或密码错误';
                        loginError.style.display = 'block';
                        setTimeout(() => { loginError.style.display = 'none'; }, 3000);
                    }
                } catch (err) {
                    loginError.textContent = '网络错误或服务器异常';
                    loginError.style.display = 'block';
                    setTimeout(() => { loginError.style.display = 'none'; }, 3000);
                }
            });
            
            // 添加CSS动画样式
            if (!document.getElementById('notification-styles')) {
                const style = document.createElement('style');
                style.id = 'notification-styles';
                style.textContent = `
                    @keyframes slideIn {
                        from {
                            transform: translateX(100%);
                            opacity: 0;
                        }
                        to {
                            transform: translateX(0);
                            opacity: 1;
                        }
                    }
                    
                    @keyframes slideOut {
                        from {
                            transform: translateX(0);
                            opacity: 1;
                        }
                        to {
                            transform: translateX(100%);
                            opacity: 0;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</body>
</html>
